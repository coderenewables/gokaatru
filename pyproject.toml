[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gokaatru"
version = "0.1.0"
description = "Wind Resource Assessment MCP Server"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "fastapi>=0.115",
    "pydantic>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "matplotlib>=3.7",
    "plotly>=5.15",
    "orjson>=3.10",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "windrose>=1.9",
    "xarray>=2023.1",
    "zarr>=3.0",  # EarthDataHub migrated all ERA5 Zarr stores to the Zarr v3 spec (2026-09);
                  # zarr-python 2.x cannot open a v3 store at all. Their own docs pin `zarr>3`.
    "dask>=2024.1",  # required by EarthDataHub's documented `xr.open_dataset(..., chunks={})`
                      # lazy-loading pattern used in server/tools/era5.py._open_era5_dataset
    "aiohttp>=3.9",  # was only a transitive dependency (via fsspec/s3fs); EarthDataHub's docs
                      # list it as directly required for the Zarr HTTP store access
    "fsspec>=2023.1",
    "s3fs>=2023.1",
    "windkit>=2.0,<2.1",  # pin: widen deliberately after testing new major.minor
                         # headless deployments must set WINDKIT_NAME, WINDKIT_EMAIL,
                         # WINDKIT_INSTITUTION to avoid interactive first-run prompts
    "geopandas>=0.14",
    "pyproj>=3.6",
]

[project.optional-dependencies]
ml = ["xgboost>=1.7", "scikit-learn>=1.2"]
dev = ["pytest>=7.0", "ruff>=0.1", "httpx>=0.28"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["server*"]